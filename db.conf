# ---------- HOST ----------
HOST=host_url
HOST_PORT=5432
HOST_DBNAME=host_dbname
HOST_USER=host_user
HOST_PASSWORD=host_password
HOST_SSL=prefer

# ---------- LOCAL ----------
LOCAL=localhost
LOCAL_PORT=5432
LOCAL_DBNAME=local_dbname
LOCAL_USER=local_user
LOCAL_PASSWORD=local_password
LOCAL_SSL=prefer

# ---------- Optional: point to PostgreSQL bin if not in PATH ----------
# PG_BIN=C:\Program Files\PostgreSQL\16\bin

# ---------- SAFETY SWITCHES ----------
LOCAL_MUST_BE_LOOPBACK=true    # require 127.0.0.1 or ::1
