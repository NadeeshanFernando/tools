[package]
name = "db-backup-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"          # <-- add plugin
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
keyring = "3"

# full tokio so we can use time/net/process etc.
tokio = { version = "1", features = ["full"] }

# SQL drivers
tokio-postgres = "0.7"   # PostgreSQL
mysql_async = "0.33"     # MySQL / MariaDB
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono"] }  # SQL Server (TLS via rustls)
rusqlite = { version = "0.31", features = ["bundled"] }  # SQLite (bundled for Windows)

# stream compat for tiberius
tokio-util = "0.7"

# MongoDB
mongodb = { version = "2", default-features = false, features = ["tokio-runtime"] }
bson = "2"

# tool preflight
which = "6"                           # <-- add which

[build-dependencies]
tauri-build = { version = "2", features = [] }
